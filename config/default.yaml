dataset:
  target: 7            # 0-indexed QM9 target (7 = U0, internal energy at 0K)
  split: [0.8, 0.1, 0.1]
  seed: 42
  feature_mode: topology   # topology | geometry | full

training:
  epochs: 200
  batch_size: 32
  lr: 1.0e-3
  scheduler: cosine        # cosine | step | none
  patience: 20             # early stopping patience

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.0
