dataset:
  target: 7
  split: [0.8, 0.1, 0.1]
  seed: 42
  feature_mode: geometry

training:
  epochs: 150
  batch_size: 32
  lr: 3.0e-4
  scheduler: cosine
  patience: 30

model:
  hidden_channels: 128
  num_interactions: 6
  num_filters: 128
  num_gaussians: 50
  cutoff: 10.0
  max_num_neighbors: 32
  readout: add
  dipole: false
