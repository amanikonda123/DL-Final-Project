dataset:
  target: 7
  split: [0.8, 0.1, 0.1]
  seed: 42
  feature_mode: geometry

training:
  epochs: 30           # increase to 200 on Colab
  batch_size: 32
  lr: 5.0e-4
  scheduler: cosine
  patience: 20

model:
  hidden_channels: 128   # embedding/filter size — keep at 128
  num_interactions: 6    # increase to 6 on Colab
  num_filters: 128
  num_gaussians: 50      # physics-motivated, don't tune
  cutoff: 10.0           # angstrom, don't tune
  max_num_neighbors: 32
  readout: add
  dipole: false
